name: Release APK
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NFC_NOTE_KEYSTORE: ${{ github.workspace }}/signing/release.p12
      NFC_NOTE_STORE_PASSWORD: ${{ secrets.NFC_NOTE_STORE_PASSWORD }}
      NFC_NOTE_KEY_ALIAS: ${{ secrets.NFC_NOTE_KEY_ALIAS }}
      NFC_NOTE_KEY_PASSWORD: ${{ secrets.NFC_NOTE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NFC_NOTE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$NFC_NOTE_STORE_PASSWORD"
          test -n "$NFC_NOTE_KEY_ALIAS"
          test -n "$NFC_NOTE_KEY_PASSWORD"
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$NFC_NOTE_KEYSTORE"
          chmod 600 "$NFC_NOTE_KEYSTORE"
      - name: Check tag matches version
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Preserve R8 mapping and reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-r8-reports
          path: app/build/outputs/mapping/release/
      - name: Verify signature and package
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/nfc-note-${GITHUB_REF_NAME}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS
      - name: Publish prerelease for physical testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "NFC Note $GITHUB_REF_NAME" --notes-file docs/release-notes.md
      - name: Remove signing material
        if: always()
        run: rm -rf signing
